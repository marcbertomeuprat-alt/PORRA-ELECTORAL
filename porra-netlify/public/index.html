<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porra electoral</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--card:#fffdf9;--fg:#1d1b20;--mut:#74706a;--acc:#d6452b;--bd:#e8e2d6;--ok:#2e7d4f;--sh:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(80,50,20,.09);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1b1d22;--fg:#efece6;--mut:#9d9a94;--acc:#ef6a5e;--bd:#2d3037;--ok:#5cc48a;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--card:#1b1d22;--fg:#efece6;--mut:#9d9a94;--acc:#ef6a5e;--bd:#2d3037;--ok:#5cc48a;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px 16px 40px}
.hero{background:linear-gradient(135deg,#b3261e 0%,#e2582f 55%,#f2a33a 100%);color:#fff;border-radius:22px;padding:26px 22px 22px;margin-bottom:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.13)}
h1{font:800 clamp(1.6rem,6vw,2.2rem)/1.1 Fraunces,Georgia,serif;margin:0 0 8px;position:relative}
h2{font:700 1.12rem/1.2 Fraunces,Georgia,serif;margin:0 0 12px}
.sub{margin:0;font-size:.95rem;font-weight:500;position:relative;opacity:.95}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
label{display:block;font-size:.8rem;font-weight:600;letter-spacing:.02em;color:var(--mut);margin:12px 0 4px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:transparent;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.row{display:flex;align-items:center;gap:12px;margin:8px 0;padding:6px 8px;border-radius:12px}
.row:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.row span{flex:1;font-weight:500;line-height:1.25}.row small{font-weight:400}
.row input{width:88px;text-align:center;font-size:1.15rem;font-weight:600}
button{background:linear-gradient(135deg,#d6452b,#ea7a35);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:600;cursor:pointer;margin-top:12px;box-shadow:0 4px 12px rgba(214,69,43,.28);transition:transform .1s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.sum{text-align:right;font-weight:600;font-size:.92rem;color:var(--acc);margin-top:6px}.sum.ok{color:var(--ok)}
.msg{font-size:.86rem;color:var(--mut);margin-top:10px}
.p{border-top:1px solid var(--bd);padding:12px 0}.p:first-child{border-top:0}
.p b{display:flex;justify-content:space-between;gap:8px;font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.78rem;border:1px solid var(--bd);border-radius:99px;padding:3px 10px;color:var(--mut);background:var(--bg)}
.pill{display:inline-block;font-size:.72rem;border-radius:99px;padding:2px 9px;background:var(--acc);color:#fff;margin-left:8px;vertical-align:2px}
.blk{display:flex;flex-wrap:wrap;gap:18px;align-items:center}.inputs{flex:1 1 250px}.hemi{flex:1 1 280px}
.hemi svg{display:block;width:100%}.hemi .chips{justify-content:center}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
</style>
</head>
<body>
<main>
  <header class="hero"><h1 id="title">🗳️ Porra electoral</h1>
  <p class="sub" id="deadline">Carregant…</p></header>
  <div id="status" class="msg"></div>
  <div id="setup"></div>
  <div id="form"></div>
  <div id="ranking"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,user=null,uid=null,owner=false,cfg=null,preds={},names={},formKey='';
const DEF_DEADLINE=new Date(2026,10,29,8,0).getTime();
const fmt=ms=>new Date(ms).toLocaleString('ca',{dateStyle:'long',timeStyle:'short'});
const toLocalInput=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16);
const closed=()=>cfg&&Date.now()>=cfg.deadline;
const num=v=>{const n=parseInt(String(v),10);return isNaN(n)||n<0?0:n};
function secs(){
  if(!cfg)return[];
  return [
    {k:'esp',title:'Total Congrés',parties:cfg.parties||[],total:cfg.total||350,results:cfg.results,field:'parties',rk:'results'},
    {k:'cat',title:'Diputats a Catalunya',parties:cfg.partiesCat||[],total:cfg.totalCat||48,results:cfg.resultsCat,field:'cat',rk:'resultsCat'}
  ].filter(s=>s.parties.length);
}
const getP=(pred,s)=>pred[s.field]||[];
const hasRes=s=>s.results&&s.parties.every(p=>typeof s.results[p]==='number');
const hasResults=()=>secs().some(hasRes);
function sscore(pred,s){let err=0;s.parties.forEach(p=>{const m=getP(pred,s).find(x=>x.p===p);err+=Math.abs((m?m.v:0)-s.results[p])});return Math.round(Math.max(0,s.total-err)/s.total*1000)/10}
const score=pred=>Math.round(secs().filter(hasRes).reduce((a,s)=>a+sscore(pred,s),0)*10)/10;
const COL=[[/psoe|psc/,'#e30613'],[/^pp$|popular/,'#1d84ce'],[/vox/,'#63be21'],[/sumar/,'#e5336b'],[/comuns|comú/,'#c4007a'],[/podemos/,'#7b2d8e'],[/frente amplio|front ampli|^fa$/,'#e0001b'],[/convergència|convergencia|cdc|pdecat|^ciu$/,'#9a9b20'],[/erc|esquerra/,'#ff7a00'],[/junts|jxcat/,'#00c3b2'],[/pnv/,'#2e9e44'],[/bildu/,'#b5cf18'],[/bng/,'#6fb7e8'],[/\bcc\b|canaria/,'#ffd500'],[/^cup/,'#ffe600'],[/^cs$|ciutadans|ciudadanos/,'#f26b21'],[/aliança|alianza/,'#0b4f8a'],[/upn/,'#c8102e'],[/pacma/,'#7ac143'],[/altres|otros|resta/,'#9aa0a6']];
function pcol(n){const k=n.toLowerCase().trim();for(const [r,c] of COL)if(r.test(k))return c;let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%360;return 'hsl('+h+',55%,50%)'}
function drawHemi(s,vals){
  const el=$('hemi_'+s.k);if(!el)return;
  const N=s.total,rows=Math.max(2,Math.round(Math.sqrt(N)/2.1)),R=95,r0=38,dr=(R-r0)/(rows-1);
  const rad=[];for(let i=0;i<rows;i++)rad.push(r0+i*dr);
  const sum=rad.reduce((a,b)=>a+b,0),cnt=rad.map(r=>Math.round(N*r/sum));
  cnt[rows-1]+=N-cnt.reduce((a,b)=>a+b,0);
  const pts=[];
  rad.forEach((r,i)=>{const n=cnt[i];for(let j=0;j<n;j++){const th=Math.PI*(1-(n===1?0.5:j/(n-1)));pts.push({x:100+r*Math.cos(th),y:100-r*Math.sin(th),th,r})}});
  pts.sort((a,b)=>b.th-a.th||a.r-b.r);
  const dot=0.42*Math.min(dr,Math.PI*R/Math.max(1,cnt[rows-1]-1));
  const cols=[];s.parties.forEach((p,i)=>{for(let k=0;k<(vals[i]||0);k++)cols.push(pcol(p))});
  const used=Math.min(cols.length,N);
  const svg=pts.map((q,i)=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${dot.toFixed(2)}" fill="${i<used?cols[i]:'var(--bd)'}"/>`).join('');
  const leg=s.parties.map((p,i)=>vals[i]?`<span class="chip"><i style="background:${pcol(p)}"></i>${esc(p)} ${vals[i]}</span>`:'').join('');
  el.innerHTML=`<svg viewBox="0 0 200 108" role="img" aria-label="Hemicicle">${svg}<text x="100" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">${used}</text><text x="100" y="104" text-anchor="middle" font-size="7" fill="var(--mut)">de ${N}${s.k==='esp'?' · majoria '+(Math.floor(N/2)+1):''}</text></svg><div class="chips">${leg}</div>`;
}
const leaderOf=(s,p)=>(cfg.leaders||{})[s.k+':'+p]||'';
function face(s,p,sz){
  const c=pcol(p),ph=(cfg.photos||{})[s.k+':'+p],ld=leaderOf(s,p);
  if(ph)return `<img src="${ph}" alt="${esc(ld||p)}" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;border:3px solid ${c};flex:none">`;
  const ini=(ld||p).split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return `<span style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c};color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.4)}px;font-weight:700;flex:none">${esc(ini)}</span>`;
}
function showErr(e){$('status').textContent='Error: '+(e&&e.message||e)}

let myName='',code='',adminCode='',lastCfg='',started=false;
async function api(body){
  const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...body,code,adminCode,name:myName})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;
}
async function refresh(force){
  const j=await api({action:'state'});
  cfg=j.config||null;preds=j.preds||{};uid=j.me;owner=!!j.admin;
  names={};Object.entries(preds).forEach(([id,p])=>names[id]=p.name);
  const s=JSON.stringify(cfg);
  if(force||s!==lastCfg){lastCfg=s;renderConfig()}else renderRanking();
}
const saveCfg=async c=>{await api({action:'config',config:c});await refresh(true)};
const savePred=async p=>{await api({action:'save',pred:p});await refresh()};
function start(){if(!started){started=true;setInterval(()=>refresh().catch(()=>{}),20000)}}
function showLogin(msg){
  $('deadline').textContent='';$('form').innerHTML='';$('ranking').innerHTML='';
  $('setup').innerHTML=`<div class="card"><h2>Entra a la porra</h2>
  <label>El teu nom</label><input id="l_name" value="${esc(myName)}">
  <label>Codi d’accés del grup</label><input id="l_code" type="password">
  <details style="margin-top:12px"><summary class="msg">Sóc l’organitzador</summary><label>Codi d’organitzador</label><input id="l_admin" type="password"></details>
  <button id="l_go">Entrar</button><div class="msg">${esc(msg||'')}</div></div>`;
  $('l_go').onclick=async()=>{
    myName=$('l_name').value.trim();code=$('l_code').value.trim();adminCode=$('l_admin').value.trim();
    if(!myName&&!adminCode){showLogin('Escriu el teu nom.');return}
    try{await refresh(true);try{localStorage.setItem('porra',JSON.stringify({name:myName,code,admin:adminCode}))}catch(e){}start()}
    catch(e){showLogin(e.message)}
  };
}
async function init(){
  let sv={};try{sv=JSON.parse(localStorage.getItem('porra')||'{}')}catch(e){}
  if(sv.name||sv.admin){myName=sv.name||'';code=sv.code||'';adminCode=sv.admin||'';
    try{await refresh(true);start();return}catch(e){}}
  showLogin();
}

function renderConfig(){
  $('title').textContent='🗳️ '+((cfg&&cfg.title)||'Porra electoral');
  tick();
  renderSetup();renderForm();renderRanking();
}

function renderSetup(){
  const el=$('setup');
  if(!owner){el.innerHTML='';if(!cfg)$('status').textContent='L’organitzador encara ha de configurar la porra.';return}
  const c=cfg||{title:'Porra eleccions generals',deadline:DEF_DEADLINE,total:350,parties:[],totalCat:48,partiesCat:[]};
  el.innerHTML=`<div class="card"><h2>⚙️ Configuració (només organitzador)</h2>
  <label>Títol</label><input id="s_title" value="${esc(c.title)}">
  <label>Tancament de les prediccions</label><input id="s_dl" type="datetime-local" value="${toLocalInput(c.deadline)}">
  <label>Total de diputats al Congrés</label><input id="s_total" inputmode="numeric" value="${c.total||350}">
  <label>Partits del total Congrés (un per línia, opcionalment «Partit | Cap de llista»; afegeix-hi «Altres»)</label>
  <textarea id="s_parties" rows="6">${esc((c.parties||[]).map(p=>p+((c.leaders||{})['esp:'+p]?' | '+c.leaders['esp:'+p]:'')).join('\n'))}</textarea>
  <label>Diputats que s’escullen a Catalunya</label><input id="s_totalCat" inputmode="numeric" value="${c.totalCat||48}">
  <label>Partits a Catalunya (un per línia, opcionalment «Partit | Cap de llista»; afegeix-hi «Altres»)</label>
  <textarea id="s_partiesCat" rows="6">${esc((c.partiesCat||[]).map(p=>p+((c.leaders||{})['cat:'+p]?' | '+c.leaders['cat:'+p]:'')).join('\n'))}</textarea>
  <button id="s_save">Desar configuració</button>
  ${secs().map(s=>`<h2 style="margin-top:18px">Resultats oficials · ${esc(s.title)}</h2>
  ${s.parties.map((p,i)=>`<div class="row"><span>${esc(p)}</span><input data-r="${s.k}:${i}" inputmode="numeric" value="${s.results&&typeof s.results[p]==='number'?s.results[p]:''}"></div>`).join('')}
  <button data-rs="${s.k}">Desar resultats</button>
  <label>Fotos dels caps de llista · ${esc(s.title)} (opcional)</label>${s.parties.map(p=>`<div class="row">${face(s,p,28)}<span>${esc(p)}${leaderOf(s,p)?' · '+esc(leaderOf(s,p)):''}</span><input type="file" accept="image/*" data-ph="${s.k}:${esc(p)}" style="width:150px;border:0;padding:0;font-size:.75rem"></div>`).join('')}`).join('')}
  <div class="msg" id="s_msg"></div></div>`;
  const parse=id=>{const names=[],ld={};$(id).value.split('\n').forEach(l=>{const a=l.split('|'),n=(a[0]||'').trim();if(!n)return;names.push(n);if(a[1]&&a[1].trim())ld[n]=a[1].trim()});return{names,ld}};
  el.querySelectorAll('[data-ph]').forEach(inp=>inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;const key=inp.dataset.ph,fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)*0.2,m,m,0,0,96,96);
      saveCfg({...cfg,photos:{...(cfg.photos||{}),[key]:c.toDataURL('image/jpeg',0.8)}}).then(()=>{$('s_msg').textContent='Foto desada ✔'}).catch(showErr)};im.src=fr.result};fr.readAsDataURL(f)});
  $('s_save').onclick=async()=>{
    const dl=new Date($('s_dl').value).getTime()||DEF_DEADLINE;const A=parse('s_parties'),B=parse('s_partiesCat');
    try{await saveCfg({...(cfg||{}),title:$('s_title').value.trim()||'Porra electoral',deadline:dl,
      total:parseInt($('s_total').value,10)||350,parties:A.names,
      totalCat:parseInt($('s_totalCat').value,10)||48,partiesCat:B.names,leaders:{...Object.fromEntries(Object.entries(A.ld).map(([n,l])=>['esp:'+n,l])),...Object.fromEntries(Object.entries(B.ld).map(([n,l])=>['cat:'+n,l]))}});
      $('s_msg').textContent='Desat ✔'}catch(e){showErr(e)}
  };
  el.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{
    const s=secs().find(x=>x.k===b.dataset.rs);const results={};let ok=true;
    s.parties.forEach((p,i)=>{const v=el.querySelector(`[data-r="${s.k}:${i}"]`).value;if(v.trim()==='')ok=false;results[p]=num(v)});
    if(!ok){$('s_msg').textContent='Omple tots els resultats d’aquest bloc.';return}
    try{await saveCfg({...cfg,[s.rk]:results});$('s_msg').textContent='Resultats desats ✔'}catch(e){showErr(e)}
  });
}

function renderForm(){
  const el=$('form'),ss=secs();
  if(!ss.length){el.innerHTML='';return}
  const key=JSON.stringify(ss.map(s=>[s.k,s.parties,s.total]))+closed()+JSON.stringify(cfg.leaders||{})+Object.values(cfg.photos||{}).join('').length;
  if(key===formKey)return; formKey=key;
  const mine=preds[uid],lock=closed();
  const val=(s,p)=>{const m=mine&&getP(mine,s).find(x=>x.p===p);return m?m.v:''};
  el.innerHTML=ss.map(s=>`<div class="card"><h2>La teva predicció · ${esc(s.title)}</h2><div class="blk"><div class="inputs">
  ${s.parties.map((p,i)=>`<div class="row"><div class="fc" id="fc_${s.k}_${i}" style="width:40px;height:40px;flex:none"></div><span>${esc(p)}${leaderOf(s,p)?`<br><small style="color:var(--mut)">${esc(leaderOf(s,p))}</small>`:''}</span><input data-k="${s.k}" data-i="${i}" inputmode="numeric" value="${val(s,p)}" ${lock?'disabled':''}></div>`).join('')}
  <div class="sum" id="sum_${s.k}"></div></div><div class="hemi" id="hemi_${s.k}"></div></div></div>`).join('')+
  `<div class="card" style="margin-top:-4px"><button id="save" ${lock?'disabled':''} style="margin-top:0">Desar prediccions</button>
  <div class="msg" id="msg">${lock?'Les prediccions estan tancades.':'Cada bloc ha de sumar el seu total de diputats.'}</div></div>`;
  const inp=(s)=>[...el.querySelectorAll(`[data-k="${s.k}"]`)];
  const upd=()=>{let all=true;ss.forEach(s=>{let t=0;inp(s).forEach(i=>t+=num(i.value));
    const ok=t===s.total;if(!ok)all=false;const e=$('sum_'+s.k);e.textContent='Total: '+t+' / '+s.total+' diputats';e.className='sum'+(ok?' ok':'');const vs=inp(s).map(i=>num(i.value));drawHemi(s,vs);s.parties.forEach((p,i)=>{const f=$('fc_'+s.k+'_'+i);if(f)f.innerHTML=vs[i]>0?face(s,p,40):''})});
    $('save').disabled=lock||!all};
  el.querySelectorAll('[data-k]').forEach(i=>i.oninput=upd);upd();
  $('save').onclick=async()=>{
    const out={at:Date.now()};
    ss.forEach(s=>{out[s.field]=s.parties.map((p,i)=>({p,v:num(inp(s)[i].value)}))});
    try{await savePred(out);$('msg').textContent='Prediccions desades ✔ (les pots canviar fins al tancament)'}catch(e){showErr(e)}
  };
}

function renderRanking(){
  const el=$('ranking');
  if(!cfg){el.innerHTML='';return}
  renderForm();
  const ss=secs();let ids=Object.keys(preds);
  if(!ids.length){el.innerHTML='<div class="card"><h2>Participants</h2><div class="msg">Encara no hi ha cap predicció.</div></div>';return}
  const res=hasResults(),reveal=closed()||res;
  if(res)ids.sort((a,b)=>score(preds[b])-score(preds[a]));else ids.sort((a,b)=>(names[a]||'').localeCompare(names[b]||''));
  el.innerHTML=`<div class="card"><h2>${res?'🏆 Classificació':'Participants ('+ids.length+')'}</h2>`+
  ids.map((id,k)=>{
    const p=preds[id];
    const det=res?`<div class="msg" style="margin-top:2px">${ss.filter(hasRes).map(s=>esc(s.title)+': '+sscore(p,s)).join(' · ')}</div>`:'';
    const chips=reveal?ss.map(s=>`<div class="chips"><span class="chip"><strong>${esc(s.title)}</strong></span>${getP(p,s).map(x=>`<span class="chip">${esc(x.p)} ${esc(x.v)}</span>`).join('')}</div>`).join(''):'';
    return `<div class="p"><b><span>${res?(['🥇','🥈','🥉'][k]||(k+1)+'.')+' ':''}${esc(names[id]||'Algú')}${id===uid?'<span class="pill">tu</span>':''}</span>${res?'<span>'+score(p)+' pts</span>':''}</b>${det}${chips}</div>`;
  }).join('')+(reveal?'':'<div class="msg">Les prediccions es mostraran quan es tanqui la porra.</div>')+
  (res?'<div class="msg">Cada bloc val 100 punts: es resta la part d’error (suma de diferències absolutes respecte al resultat real sobre el total de diputats del bloc). Els punts dels blocs se sumen.</div>':'')+'</div>';
}
let wasClosed=null;
function tick(){
  if(!cfg){$('deadline').textContent='';return}
  const c=closed();
  if(c){$('deadline').textContent='🔒 La porra està tancada';}
  else{const d=cfg.deadline-Date.now(),D=Math.floor(d/864e5),H=Math.floor(d%864e5/36e5),M=Math.floor(d%36e5/6e4);
    $('deadline').textContent='⏳ Tanca en '+(D?D+' d ':'')+H+' h '+M+' min · '+fmt(cfg.deadline)}
  if(wasClosed!==null&&wasClosed!==c){renderForm();renderRanking()}
  wasClosed=c;
}
setInterval(tick,30000);
init();
</script>
</body>
</html>
